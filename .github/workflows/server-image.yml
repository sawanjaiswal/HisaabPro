name: Server Docker Image

on:
  push:
    branches: [deploy/production]
    paths:
      - 'server/**'
      - '.github/workflows/server-image.yml'
  workflow_dispatch: {}

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hisaabpro-server:latest
            ghcr.io/${{ github.repository_owner }}/hisaabpro-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
