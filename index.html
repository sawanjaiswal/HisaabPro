<!DOCTYPE html>
<html lang="en-IN" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!--
      No-flash theme init. The app's theme source-of-truth is localStorage
      `theme` (default 'light'), applied to <html data-theme> by ThemeContext
      AFTER React mounts. This inline script sets data-theme during head parse,
      before first paint, so the critical CSS below can key its background off
      the SAME signal the app uses — never off `prefers-color-scheme`, which the
      app deliberately ignores (a dark-OS user on the light app must stay light).
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <!--
      CSP — constrains the injection-relevant directives (script-src, frame-src)
      to self + Razorpay's checkout/api origins, the only third party we embed.
      connect-src stays broad (https:/ws:) so the API base URL and Vite HMR work
      across environments without a static rebuild; tighten it at the server
      header layer where it can be env-aware. capacitor:/gap: keep the Android
      WebView shell working (PLATFORM_SHELL).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob: gap: capacitor: https://localhost; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss: ws: capacitor: https://api.razorpay.com https://lumberjack.razorpay.com https://accounts.google.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://*.razorpay.com https://accounts.google.com; child-src 'self' https://*.razorpay.com https://accounts.google.com"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f3638" />
    <meta name="description" content="Smart billing software for Indian businesses. Create GST invoices, manage inventory, track payments — all from your phone. Vyapar & MyBillBook alternative." />
    <meta name="keywords" content="billing software india, GST invoice app, billing app, smart billing software, vyapar alternative, mybillbook alternative, inventory management india, payment tracking app" />
    <meta name="author" content="HisaabPro" />
    <meta name="geo.region" content="IN" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HisaabPro" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" /></noscript>
    <title>HisaabPro — Smart Billing Software for Indian Businesses | GST Invoice & Inventory</title>
    <style>
      /* App-shell skeleton — paints in <100ms before React hydrates, regardless
         of backend/network state. Values are literal (not CSS vars) on purpose:
         this must render before the app stylesheet loads. Hidden by
         [data-app-ready] on #root once main.tsx mounts. Fast app-shell skeleton with HisaabPro's own tokens.

         Layered on purpose: src/styles/base.css's real body background lives
         in `@layer base` (Tailwind v4 reserved layer). An unlayered rule here
         would permanently win the cascade over any layered rule regardless of
         specificity/order — the skeleton's placeholder color would never be
         superseded once React mounts and the real theme (gradient / dark-mode
         token) applies. Declaring `@layer skeleton;` first registers it as the
         lowest-priority layer, so base.css's `@layer base` wins as soon as it
         loads. */
      @layer skeleton;
      :root { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      @layer skeleton {
        html, body { margin: 0; min-height: 100%; background: #F8F7F4; font-family: Inter, system-ui, sans-serif; }
        html[data-theme="dark"], html[data-theme="dark"] body { background: #0E0E0F; }
      }
      #root[data-app-ready] .app-splash-screen {
        display: none;
      }
      .app-splash-screen {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #F8F7F4;
      }
      html[data-theme="dark"] .app-splash-screen {
        background: #0E0E0F;
      }
      .app-splash-screen__brand {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      .app-splash-screen__logo {
        width: 220px; height: auto; max-width: 70vw;
      }
      .app-splash-screen__logo--light { display: block; }
      .app-splash-screen__logo--dark { display: none; }
      html[data-theme="dark"] .app-splash-screen__logo--light { display: none; }
      html[data-theme="dark"] .app-splash-screen__logo--dark { display: block; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-splash-screen" aria-hidden="true">
        <div class="app-splash-screen__brand">
          <img class="app-splash-screen__logo app-splash-screen__logo--light" src="/logos/official/hisaabpro-logo-horizontal.png" alt="HisaabPro" width="220" height="70" />
          <img class="app-splash-screen__logo app-splash-screen__logo--dark" src="/logos/official/hisaabpro-logo-white.png" alt="HisaabPro" width="220" height="70" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
