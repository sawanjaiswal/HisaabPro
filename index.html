<!DOCTYPE html>
<html lang="en-IN" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP — constrains the injection-relevant directives (script-src, frame-src)
      to self + Razorpay's checkout/api origins, the only third party we embed.
      connect-src stays broad (https:/ws:) so the API base URL and Vite HMR work
      across environments without a static rebuild; tighten it at the server
      header layer where it can be env-aware. capacitor:/gap: keep the Android
      WebView shell working (PLATFORM_SHELL).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob: gap: capacitor: https://localhost; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss: ws: capacitor: https://api.razorpay.com https://lumberjack.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://*.razorpay.com; child-src 'self' https://*.razorpay.com"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f3638" />
    <meta name="description" content="Smart billing software for Indian businesses. Create GST invoices, manage inventory, track payments — all from your phone. Vyapar & MyBillBook alternative." />
    <meta name="keywords" content="billing software india, GST invoice app, billing app, smart billing software, vyapar alternative, mybillbook alternative, inventory management india, payment tracking app" />
    <meta name="author" content="HisaabPro" />
    <meta name="geo.region" content="IN" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HisaabPro" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <title>HisaabPro — Smart Billing Software for Indian Businesses | GST Invoice & Inventory</title>
    <style>
      /* App-shell skeleton — paints in <100ms before React hydrates, regardless
         of backend/network state. Values are literal (not CSS vars) on purpose:
         this must render before the app stylesheet loads. Hidden by
         [data-app-ready] on #root once main.tsx mounts. Mirrors RentIncome's
         proven pattern (frontend/index.html) — same fix, HisaabPro's own tokens.

         Layered on purpose: src/styles/base.css's real body background lives
         in `@layer base` (Tailwind v4 reserved layer). An unlayered rule here
         would permanently win the cascade over any layered rule regardless of
         specificity/order — the skeleton's placeholder color would never be
         superseded once React mounts and the real theme (gradient / dark-mode
         token) applies. Declaring `@layer skeleton;` first registers it as the
         lowest-priority layer, so base.css's `@layer base` wins as soon as it
         loads. */
      @layer skeleton;
      :root { color-scheme: light dark; }
      @layer skeleton {
        html, body { margin: 0; min-height: 100%; background: #F8F7F4; font-family: Inter, system-ui, sans-serif; }
        @media (prefers-color-scheme: dark) { html, body { background: #0E0E0F; } }
      }
      #root[data-app-ready] .app-shell-skeleton { display: none; }
      .app-shell-skeleton {
        margin: 0 auto; display: flex; flex-direction: column;
        min-height: 100vh; max-width: 28rem; width: 100%;
        padding-top: env(safe-area-inset-top, 0px);
      }
      .app-shell-skeleton__header {
        position: sticky; top: 0; height: 56px;
        border-bottom: 1px solid rgba(11,79,94,0.08);
        background: rgba(248,247,244,0.9); backdrop-filter: blur(8px);
      }
      .app-shell-skeleton__main { flex: 1; padding: 1rem; }
      .app-shell-skeleton__row {
        height: 4rem; border-radius: 0.75rem; margin-bottom: 0.75rem;
        background: linear-gradient(90deg, rgba(11,79,94,0.06) 0%, rgba(11,79,94,0.12) 50%, rgba(11,79,94,0.06) 100%);
        background-size: 200% 100%;
        animation: app-shell-shimmer 1.4s ease-in-out infinite;
      }
      .app-shell-skeleton__nav {
        position: sticky; bottom: 0; height: 112px;
        border-top: 1px solid rgba(11,79,94,0.08); background: rgba(248,247,244,0.95);
      }
      @keyframes app-shell-shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      @media (prefers-color-scheme: dark) {
        .app-shell-skeleton__header, .app-shell-skeleton__nav { background: rgba(20,20,22,0.9); border-color: rgba(255,255,255,0.08); }
        .app-shell-skeleton__row { background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 100%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-shell-skeleton" aria-hidden="true">
        <div class="app-shell-skeleton__header"></div>
        <div class="app-shell-skeleton__main">
          <div class="app-shell-skeleton__row"></div>
          <div class="app-shell-skeleton__row"></div>
          <div class="app-shell-skeleton__row"></div>
          <div class="app-shell-skeleton__row"></div>
        </div>
        <div class="app-shell-skeleton__nav"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
