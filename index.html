<!DOCTYPE html>
<html lang="en-IN" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP — constrains the injection-relevant directives (script-src, frame-src)
      to self + Razorpay's checkout/api origins, the only third party we embed.
      connect-src stays broad (https:/ws:) so the API base URL and Vite HMR work
      across environments without a static rebuild; tighten it at the server
      header layer where it can be env-aware. capacitor:/gap: keep the Android
      WebView shell working (PLATFORM_SHELL).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob: gap: capacitor: https://localhost; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss: ws: capacitor: https://api.razorpay.com https://lumberjack.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://*.razorpay.com; child-src 'self' https://*.razorpay.com"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f3638" />
    <meta name="description" content="Smart billing software for Indian businesses. Create GST invoices, manage inventory, track payments — all from your phone. Vyapar & MyBillBook alternative." />
    <meta name="keywords" content="billing software india, GST invoice app, billing app, smart billing software, vyapar alternative, mybillbook alternative, inventory management india, payment tracking app" />
    <meta name="author" content="HisaabPro" />
    <meta name="geo.region" content="IN" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HisaabPro" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <title>HisaabPro — Smart Billing Software for Indian Businesses | GST Invoice & Inventory</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
